services:
  postgres:
    image: postgres:17-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_management
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
